name: diag

# Temporary diagnostic: DNS and TCP behaviour of the publish endpoint as seen
# from a GitHub-hosted runner. Safe to delete.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Connect
        run: |
          echo "== v4 only =="
          curl -4 -sv --max-time 10 https://zmhome.mycloudnas.com:2087/ 2>&1 | grep -E "Trying|Connected|refused|unreachable|HTTP/" | head -6 || true
          echo "== plain tcp =="
          timeout 10 bash -c '</dev/tcp/113.200.176.177/2087' && echo "tcp ok" || echo "tcp failed"
          echo "== cdn edge (control) =="
          curl -4 -s -o /dev/null -w 'baidu=%{http_code} %{time_total}s\n' --max-time 10 https://www.baidu.com/
