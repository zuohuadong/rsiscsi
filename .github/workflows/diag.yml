name: diag

# Temporary diagnostic: prints DNS and TCP/TLS behaviour for the reverse proxy
# as seen from a GitHub-hosted runner. Safe to delete.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve
        run: |
          echo "A:"; getent ahostsv4 zmhome.mycloudnas.com || true
          echo "AAAA:"; getent ahostsv6 zmhome.mycloudnas.com || true
          echo "dig:"; nslookup zmhome.mycloudnas.com 2>/dev/null | tail -6
      - name: Connect
        run: |
          echo "== tcp 2087 =="
          timeout 10 bash -c '</dev/tcp/zmhome.mycloudnas.com/2087' && echo "tcp ok" || echo "tcp failed"
          echo "== curl =="
          curl -sv --max-time 10 https://zmhome.mycloudnas.com:2087/ 2>&1 | head -15 || true
