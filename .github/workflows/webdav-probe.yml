name: WebDAV probe

# Temporary diagnostic workflow: prints the CTFile WebDAV responses as seen
# from a GitHub-hosted runner. Safe to delete.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe PROPFIND and MKCOL
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
        run: |
          set -eu
          base=${WEBDAV_URL%/}
          path="$base/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' '软件集合')"
          echo "== PROPFIND existing =="
          curl -sS -i -X PROPFIND -H 'Depth: 0' \
            --user "$WEBDAV_USERNAME:$WEBDAV_PASSWORD" "$path/" | head -25
          echo "== MKCOL existing =="
          curl -sS -i -X MKCOL \
            --user "$WEBDAV_USERNAME:$WEBDAV_PASSWORD" "$path/" | head -25
          echo "== PROPFIND without trailing slash =="
          curl -sS -o /dev/null -w '%{http_code}\n' -X PROPFIND -H 'Depth: 0' \
            --user "$WEBDAV_USERNAME:$WEBDAV_PASSWORD" "$path" || true
