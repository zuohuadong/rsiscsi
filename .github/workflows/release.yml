name: Build DMG

# Tag pushes build the DMG and publish it to the CTFile drive through a reverse
# proxy that sits on a mainland China network (WEBDAV_URL): CTFile rejects direct
# WebDAV logins from foreign IPs. Binaries are intentionally not attached to
# GitHub Releases: they are hosted on a domestic file-sharing drive so users in
# mainland China can download without a proxy, and so all traffic lands on one
# page that also collects sponsorship for the Apple Developer Program fee.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Apple silicon runner: the app and the optional kext are arm64 only.
    # macos-latest resolves to an arm64 image on public repositories.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          cat rust-toolchain.toml
          rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p iscsi-core -p iscsi-gui -p iscsi-blockd

      - name: Build DMG
        run: ./scripts/package-dmg.sh

      - name: Collect artifacts
        id: collect
        run: |
          set -eu
          dmg=$(ls dist/*.dmg | head -n 1)
          name=${dmg##*/}
          version=${name#rsiscsi-}
          version=${version%-arm64.dmg}
          shasum -a 256 "$dmg" > "$dmg.sha256"
          {
            echo "dmg=$dmg"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          cat "$dmg.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: rsiscsi-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
          retention-days: 30

      - name: Publish to CTFile
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          WEBDAV_ROOT_PATH: ${{ secrets.WEBDAV_ROOT_PATH }}
          SOFTWARE_COLLECTION_DIR: ${{ vars.SOFTWARE_COLLECTION_DIR }}
          VERSION: ${{ steps.collect.outputs.version }}
          DMG: ${{ steps.collect.outputs.dmg }}
        run: |
          # WEBDAV_URL points at a domestic reverse proxy in front of
          # dav.ctfile.com: CTFile rejects direct WebDAV logins from foreign IPs.
          ./scripts/publish-webdav.sh

      - name: Summary
        run: |
          {
            echo "### rsiscsi ${{ steps.collect.outputs.version }}"
            echo
            echo "Artifact: \`rsiscsi-dmg\` (\`${{ steps.collect.outputs.dmg }}\`)"
            echo
            echo "Published through the domestic reverse proxy in \`WEBDAV_URL\`."
          } >> "$GITHUB_STEP_SUMMARY"
