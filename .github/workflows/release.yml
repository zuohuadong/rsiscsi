name: Build DMG

# Tag pushes and manual runs build the DMG and keep it as a workflow artifact.
# Publishing happens outside CI: CTFile rejects WebDAV logins from foreign IPs,
# so a machine in mainland China uploads the artifact with
# scripts/release-local.sh. Binaries are intentionally not attached to GitHub
# Releases: they are hosted on a domestic file-sharing drive so users in
# mainland China can download without a proxy, and so all traffic lands on one
# page that also collects sponsorship for the Apple Developer Program fee.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Apple silicon runner: the app and the optional kext are arm64 only.
    # macos-latest resolves to an arm64 image on public repositories.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          cat rust-toolchain.toml
          rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p iscsi-core -p iscsi-gui -p iscsi-blockd

      - name: Build DMG
        run: ./scripts/package-dmg.sh

      - name: Collect artifacts
        id: collect
        run: |
          set -eu
          dmg=$(ls dist/*.dmg | head -n 1)
          name=${dmg##*/}
          version=${name#rsiscsi-}
          version=${version%-arm64.dmg}
          shasum -a 256 "$dmg" > "$dmg.sha256"
          {
            echo "dmg=$dmg"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          cat "$dmg.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: rsiscsi-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### rsiscsi ${{ steps.collect.outputs.version }}"
            echo
            echo "Artifact: \`rsiscsi-dmg\` (\`${{ steps.collect.outputs.dmg }}\`)"
            echo
            echo "Publishing runs outside CI: CTFile rejects WebDAV logins from"
            echo "foreign IPs, so a machine in mainland China must run"
            echo "\`scripts/release-local.sh\` or \`scripts/publish-webdav.sh\`."
          } >> "$GITHUB_STEP_SUMMARY"
