name: Build and Publish DMG

# Tag pushes and manual runs publish the DMG to the CTFile drive: the REST API
# is the primary transport and WebDAV is the fallback. Binaries are
# intentionally not attached to GitHub Releases: they are hosted on a domestic
# file-sharing drive so users in mainland China can download without a proxy,
# and so all traffic lands on one page that also collects sponsorship for the
# Apple Developer Program fee.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Apple silicon runner: the app and the optional kext are arm64 only.
    # macos-latest resolves to an arm64 image on public repositories.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          cat rust-toolchain.toml
          rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p iscsi-core -p iscsi-gui -p iscsi-blockd

      - name: Build DMG
        run: ./scripts/package-dmg.sh

      - name: Collect artifacts
        id: collect
        run: |
          set -eu
          dmg=$(ls dist/*.dmg | head -n 1)
          name=${dmg##*/}
          version=${name#rsiscsi-}
          version=${version%-arm64.dmg}
          shasum -a 256 "$dmg" > "$dmg.sha256"
          {
            echo "dmg=$dmg"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          cat "$dmg.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: rsiscsi-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
          retention-days: 30

      - name: Publish
        env:
          # CTFile REST API: only a session token is needed and missing folders
          # are created automatically. This is the preferred transport.
          CTFILE_SESSION: ${{ secrets.CTFILE_SESSION }}
          CTFILE_FOLDER_ID: ${{ secrets.CTFILE_FOLDER_ID }}
          CTFILE_TARGET_DIR: ${{ vars.SOFTWARE_COLLECTION_DIR || '软件集合/rsiscsi' }}
          # WebDAV fallback for accounts without a usable REST session token.
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          WEBDAV_ROOT_PATH: ${{ secrets.WEBDAV_ROOT_PATH }}
          SOFTWARE_COLLECTION_DIR: ${{ vars.SOFTWARE_COLLECTION_DIR }}
          VERSION: ${{ steps.collect.outputs.version }}
          DMG: ${{ steps.collect.outputs.dmg }}
        run: |
          if [ -n "${CTFILE_SESSION:-}" ] && [ -n "${CTFILE_FOLDER_ID:-}" ]; then
            ./scripts/publish-ctfile.sh
          elif [ -n "${WEBDAV_URL:-}" ] && [ -n "${WEBDAV_USERNAME:-}" ] && [ -n "${WEBDAV_PASSWORD:-}" ]; then
            ./scripts/publish-webdav.sh
          else
            echo "::error::add CTFILE_SESSION and CTFILE_FOLDER_ID, or WEBDAV_URL, WEBDAV_USERNAME and WEBDAV_PASSWORD"
            exit 1
          fi
